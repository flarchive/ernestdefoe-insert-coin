<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coil</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050a1c; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Coil"></canvas>
<script>
/* Coil: an original glide-snake for the Insert Coin arcade. MIT. */
(() => {
  'use strict';

  // ---- SDK guard (the arcade injects window.InsertCoin; standalone pages have none) ----
  const IC = window.InsertCoin || { standalone: true, muted: false, ready() {}, gameOver() {}, submitScore() {}, on() {} };

  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const FONT = 'ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif';
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  const N = 20;                       // grid is N x N
  const GOLD_LIFE = 6.5;              // seconds a golden pellet lasts
  const STREAK_WINDOW = 4.5;          // seconds between bites to keep a streak
  const AUTO = /autopilot/.test(location.hash); // dev hook for cover shots: the pilot plays the run
  const D = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------- audio
  let actx = null, master = null, noiseBuf = null;
  let muted = !!IC.muted;
  function audio() {
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = muted ? 0 : 0.55;
        master.connect(actx.destination);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === 'suspended') actx.resume().catch(() => {});
    } catch (e) { /* audio is optional */ }
    return actx;
  }
  function setMuted(m) {
    muted = !!m;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.55, actx.currentTime, 0.02);
  }
  function tone(freq, dur, o = {}) {
    if (!actx || muted || actx.state !== 'running') return;
    const t = actx.currentTime + (o.delay || 0);
    const osc = actx.createOscillator(), gn = actx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * o.slide), t + dur);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gn).connect(master);
    osc.start(t); osc.stop(t + dur + 0.03);
  }
  function noise(dur, o = {}) {
    if (!actx || muted || actx.state !== 'running') return;
    const t = actx.currentTime + (o.delay || 0);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
    src.buffer = noiseBuf;
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.freq || 1200, t);
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    gn.gain.setValueAtTime(o.vol || 0.3, t);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(gn).connect(master);
    src.start(t); src.stop(t + dur + 0.03);
  }
  const sfx = {
    eat(streak) { const b = 480 * Math.pow(1.06, Math.min(streak, 12)); tone(b, 0.1, { type: 'triangle', vol: 0.22, slide: 1.7 }); tone(b * 2, 0.07, { vol: 0.08, delay: 0.035 }); },
    gold() { [660, 880, 1175, 1568].forEach((f, i) => tone(f, 0.14, { type: 'triangle', vol: 0.16, delay: i * 0.055 })); },
    goldSpawn() { tone(1320, 0.18, { vol: 0.06 }); tone(1760, 0.22, { vol: 0.05, delay: 0.08 }); },
    goldGone() { tone(520, 0.25, { type: 'sine', vol: 0.07, slide: 0.5 }); },
    turn() { tone(190, 0.035, { type: 'sine', vol: 0.035 }); },
    start() { [392, 523, 784].forEach((f, i) => tone(f, 0.12, { type: 'triangle', vol: 0.14, delay: i * 0.08 })); },
    die() { noise(0.55, { freq: 1800, sweep: 120, vol: 0.45 }); tone(230, 0.7, { type: 'sawtooth', vol: 0.16, slide: 0.18 }); },
    pop(i) { if (i % 3 === 0) tone(300 + i * 9, 0.05, { type: 'square', vol: 0.025 }); },
  };
  function toggleMute() { setMuted(!muted); }
  IC.on('init', (d) => setMuted(d && d.muted));
  IC.on('mute', (d) => setMuted(d && d.muted));

  // ---------------------------------------------------------------- layout
  let W = 0, H = 0, dpr = 1;
  const board = { x: 0, y: 0, s: 0, c: 0 };
  const hud = { y: 0, h: 0 };
  let bg = null; // cached background + board

  function layout() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    hud.h = clamp(H * 0.08, 40, 66);
    const pad = clamp(Math.min(W, H) * 0.035, 8, 28);
    const s = Math.max(100, Math.min(W - pad * 2, H - hud.h - pad * 2));
    board.s = s; board.c = s / N;
    board.x = (W - s) / 2;
    const top = Math.max(pad * 0.5, (H - hud.h - s) / 2);
    hud.y = top; board.y = top + hud.h;
    buildBg();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function buildBg() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const b = bg.getContext('2d');
    b.setTransform(dpr, 0, 0, dpr, 0, 0);
    // deep navy sky with a soft emerald bloom behind the board
    const sky = b.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#071230'); sky.addColorStop(1, '#03060f');
    b.fillStyle = sky; b.fillRect(0, 0, W, H);
    const cx = board.x + board.s / 2, cy = board.y + board.s / 2;
    const bloom = b.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bloom.addColorStop(0, 'rgba(16,185,129,0.14)'); bloom.addColorStop(1, 'rgba(16,185,129,0)');
    b.fillStyle = bloom; b.fillRect(0, 0, W, H);
    // board panel
    const r = board.c * 0.7;
    b.save();
    b.shadowColor = 'rgba(132,204,22,0.55)'; b.shadowBlur = 22;
    roundRect(b, board.x, board.y, board.s, board.s, r);
    b.fillStyle = '#081530'; b.fill();
    b.restore();
    const inner = b.createRadialGradient(cx, cy, board.s * 0.1, cx, cy, board.s * 0.75);
    inner.addColorStop(0, 'rgba(30,64,120,0.35)'); inner.addColorStop(1, 'rgba(4,10,28,0.6)');
    roundRect(b, board.x, board.y, board.s, board.s, r); b.fillStyle = inner; b.fill();
    // grid dots
    b.fillStyle = 'rgba(163,230,53,0.09)';
    const dot = Math.max(1, board.c * 0.06);
    for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
      b.beginPath(); b.arc(board.x + i * board.c, board.y + j * board.c, dot, 0, 6.283); b.fill();
    }
    // the wall
    b.lineWidth = Math.max(2, board.c * 0.12);
    b.strokeStyle = '#a3e635';
    b.save(); b.shadowColor = '#84cc16'; b.shadowBlur = 14;
    roundRect(b, board.x, board.y, board.s, board.s, r); b.stroke(); b.restore();
    b.lineWidth = 1; b.strokeStyle = 'rgba(236,252,203,0.55)';
    roundRect(b, board.x + 1, board.y + 1, board.s - 2, board.s - 2, r); b.stroke();
  }

  // ---------------------------------------------------------------- game state
  let mode = 'attract';      // attract | play | dying | over
  let paused = false;
  let best = 0, score = 0, reported = false, newBest = false;
  let game = null, demo = null;
  let time = 0, overT = 0, dyingT = 0;
  let shake = 0, flash = 0, flashColor = '255,255,255', hitStop = 0;
  const parts = [], pops = [];

  function makeGame(isDemo) {
    const segs = [];
    for (let i = 0; i < 4; i++) segs.push([7 - i, 10]);
    const s = {
      segs, prev: segs.map((p) => p.slice()), dir: D.right, queue: [], grow: 0, acc: 0,
      food: null, gold: null, streak: 0, lastEat: -99, clock: 0, waves: [], burst: 0,
      startDelay: isDemo ? 0.8 : 0.9, demo: !!isDemo,
    };
    s.food = freeCell(s);
    return s;
  }
  const stepMs = (s) => Math.max(62, 150 - (s.segs.length - 4) * 2.3);

  const occ = new Uint8Array(N * N);
  function fillOcc(s, skipTail) {
    occ.fill(0);
    const n = s.segs.length - (skipTail ? 1 : 0);
    for (let i = 0; i < n; i++) occ[s.segs[i][1] * N + s.segs[i][0]] = 1;
  }
  function freeCell(s) {
    fillOcc(s, false);
    if (s.food) occ[s.food[1] * N + s.food[0]] = 1;
    if (s.gold) occ[s.gold.p[1] * N + s.gold.p[0]] = 1;
    const free = [];
    for (let i = 0; i < N * N; i++) if (!occ[i]) free.push(i);
    if (!free.length) return null;
    const k = free[(Math.random() * free.length) | 0];
    return [k % N, (k / N) | 0];
  }
  function blocked(s, x, y) {
    if (x < 0 || y < 0 || x >= N || y >= N) return true;
    const n = s.segs.length - (s.grow > 0 ? 0 : 1); // the tail moves out of the way
    for (let i = 0; i < n; i++) if (s.segs[i][0] === x && s.segs[i][1] === y) return true;
    return false;
  }

  // advance one cell; returns false on a crash
  function step(s) {
    if (s.queue.length) s.dir = s.queue.shift();
    const h = s.segs[0], nx = h[0] + s.dir[0], ny = h[1] + s.dir[1];
    if (blocked(s, nx, ny)) return false;
    s.prev = s.segs.map((p) => p.slice());
    s.segs.unshift([nx, ny]);
    if (s.grow > 0) s.grow--; else s.segs.pop();

    if (s.food && nx === s.food[0] && ny === s.food[1]) {
      s.streak = s.clock - s.lastEat < STREAK_WINDOW ? s.streak + 1 : 0;
      s.lastEat = s.clock;
      const pts = 10 + 2 * Math.min(s.streak, 10);
      s.grow += 1;
      s.waves.push(0);
      burst(nx, ny, 14, 84, 1);
      if (!s.demo) {
        score += pts; sfx.eat(s.streak);
        pop(nx, ny, '+' + pts, s.streak >= 2 ? 'x' + (s.streak + 1) + ' streak' : '', '#d9f99d');
      }
      s.food = null;
      s.food = freeCell(s);
      if (!s.gold && s.segs.length >= 6 && Math.random() < 0.24) {
        const p = freeCell(s);
        if (p) { s.gold = { p, life: GOLD_LIFE }; if (!s.demo) sfx.goldSpawn(); }
      }
    } else if (s.gold && nx === s.gold.p[0] && ny === s.gold.p[1]) {
      const pts = 25 + Math.round(50 * s.gold.life / GOLD_LIFE);
      s.grow += 2;
      s.waves.push(0, -3);
      burst(nx, ny, 26, 45, 1.4);
      if (!s.demo) {
        score += pts; sfx.gold(); shake = Math.max(shake, 5); hitStop = 0.05;
        flash = 0.25; flashColor = '251,191,36';
        pop(nx, ny, '+' + pts, 'GOLDEN', '#fde68a');
      }
      s.gold = null;
    }
    return true;
  }

  // simple attract-mode pilot: head for the pellet, avoid walls, avoid boxing itself in
  const seen = new Uint8Array(N * N), bfsQ = new Int16Array(N * N);
  function room(s, x, y) {
    fillOcc(s, true); seen.set(occ);
    let qh = 0, qt = 0, count = 0;
    seen[y * N + x] = 1; bfsQ[qt++] = y * N + x;
    while (qh < qt && count < 220) {
      const k = bfsQ[qh++], cx = k % N, cy = (k / N) | 0; count++;
      if (cx > 0 && !seen[k - 1]) { seen[k - 1] = 1; bfsQ[qt++] = k - 1; }
      if (cx < N - 1 && !seen[k + 1]) { seen[k + 1] = 1; bfsQ[qt++] = k + 1; }
      if (cy > 0 && !seen[k - N]) { seen[k - N] = 1; bfsQ[qt++] = k - N; }
      if (cy < N - 1 && !seen[k + N]) { seen[k + N] = 1; bfsQ[qt++] = k + N; }
    }
    return count;
  }
  function pilot(s) {
    const h = s.segs[0], d = s.dir;
    const target = s.gold ? s.gold.p : s.food;
    let bestD = null, bestV = -Infinity;
    for (const o of [d, [d[1], -d[0]], [-d[1], d[0]]]) {
      const nx = h[0] + o[0], ny = h[1] + o[1];
      if (blocked(s, nx, ny)) continue;
      let v = target ? -Math.abs(nx - target[0]) - Math.abs(ny - target[1]) : 0;
      const r = room(s, nx, ny);
      if (r < s.segs.length + 2) v -= 500 - r;
      v += Math.random() * 0.4 + (o === d ? 0.2 : 0);
      if (v > bestV) { bestV = v; bestD = o; }
    }
    if (bestD) s.dir = bestD;
  }

  function tick(s, dt) {
    s.clock += dt;
    for (let i = s.waves.length - 1; i >= 0; i--) { s.waves[i] += dt * 34; if (s.waves[i] > s.segs.length + 4) s.waves.splice(i, 1); }
    if (s.startDelay > 0) { s.startDelay -= dt; return; }
    if (s.gold) {
      s.gold.life -= dt;
      if (s.gold.life <= 0) { burst(s.gold.p[0], s.gold.p[1], 10, 45, 0.6); if (!s.demo) sfx.goldGone(); s.gold = null; }
    }
    s.acc += dt * 1000;
    let ms = stepMs(s);
    while (s.acc >= ms) {
      if (s.demo || AUTO) pilot(s);
      if (!step(s)) { crash(s); return; }
      s.acc -= ms;
      ms = stepMs(s);
    }
  }

  function crash(s) {
    s.acc = stepMs(s); // freeze on the last cell
    if (s.demo) {
      for (const p of s.segs) burst(p[0], p[1], 3, 150, 0.7);
      demo = makeGame(true);
      return;
    }
    mode = 'dying'; dyingT = 0; s.burst = 0;
    hitStop = 0.14; shake = 16; flash = 0.5; flashColor = '248,113,113';
    sfx.die();
    if (!reported) {
      reported = true;
      newBest = score > best;
      best = Math.max(best, score);
      IC.gameOver(score);
    }
  }

  function newRun() {
    audio();
    game = makeGame(false);
    score = 0; reported = false; newBest = false;
    mode = 'play'; paused = false; overT = 0;
    parts.length = 0; pops.length = 0; shake = 0; flash = 0; hitStop = 0;
    sfx.start();
  }

  // ---------------------------------------------------------------- effects
  function burst(cx, cy, n, hue, power) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, sp = rnd(2, 7) * power;
      parts.push({ x: cx + 0.5, y: cy + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rnd(0.35, 0.8), hue: hue + rnd(-12, 12), size: rnd(0.08, 0.2) });
    }
  }
  function pop(cx, cy, text, sub, color) {
    pops.push({ x: cx + 0.5, y: cy + 0.5, text, sub, color, life: 0 });
  }
  function updateFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 3 * dt; p.vy *= 1 - 3 * dt;
      if (p.life > p.max) parts.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) { pops[i].life += dt; if (pops[i].life > 1) pops.splice(i, 1); }
    shake = Math.max(0, shake - dt * 40);
    flash = Math.max(0, flash - dt * 2.2);
  }

  // ---------------------------------------------------------------- input
  function queueDir(d) {
    if (mode !== 'play' || !game) return;
    const q = game.queue;
    const last = q.length ? q[q.length - 1] : game.dir;
    if (d === last || (d[0] === -last[0] && d[1] === -last[1])) return; // same way or a 180
    if (q.length < 2) { q.push(d); sfx.turn(); }
  }
  const canRestart = () => mode === 'attract' || (mode === 'over' && overT > 0.6);
  const KEYS = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };

  window.addEventListener('keydown', (e) => {
    audio();
    const k = e.code, dir = KEYS[k];
    if (dir || k === 'Space' || k === 'Enter') e.preventDefault();
    if (k === 'KeyM') { if (!e.repeat) toggleMute(); return; }
    if (mode === 'play') {
      if (paused) { if (!e.repeat) paused = false; return; }
      if (dir) queueDir(D[dir]);
      else if (!e.repeat && (k === 'Space' || k === 'KeyP' || k === 'Escape')) paused = true;
    } else if (!e.repeat && (k === 'Enter' || k === 'Space') && IC.standalone && canRestart()) {
      newRun();
    }
  });

  let sw = null;
  cv.addEventListener('pointerdown', (e) => {
    audio(); cv.focus(); e.preventDefault();
    if (mode === 'play' && paused) { paused = false; return; }
    if (mode !== 'play') { if (IC.standalone && canRestart()) newRun(); return; }
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    const th = clamp(Math.min(W, H) * 0.035, 14, 34);
    if (Math.hypot(dx, dy) >= th) {
      queueDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? D.right : D.left) : (dy > 0 ? D.down : D.up));
      sw.x = e.clientX; sw.y = e.clientY; sw.moved = true;
    }
  });
  function endPointer(e) {
    if (!sw || e.pointerId !== sw.id) return;
    // a plain tap/click turns towards the tapped side of the head
    if (!sw.moved && e.type === 'pointerup' && mode === 'play' && game) {
      const h = headPx(game);
      const dx = e.clientX - h[0], dy = e.clientY - h[1];
      if (game.dir[0] !== 0) { if (Math.abs(dy) > board.c * 0.5) queueDir(dy > 0 ? D.down : D.up); }
      else if (Math.abs(dx) > board.c * 0.5) queueDir(dx > 0 ? D.right : D.left);
    }
    sw = null;
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && mode === 'play') paused = true;
    last = performance.now();
  });
  window.addEventListener('resize', layout);

  IC.on('start', () => newRun());

  // ---------------------------------------------------------------- drawing
  const px = (cx) => board.x + (cx + 0.5) * board.c;
  const py = (cy) => board.y + (cy + 0.5) * board.c;
  const tOf = (s) => (s.startDelay > 0 ? 0 : clamp(s.acc / stepMs(s), 0, 1));
  function headPx(s) {
    const t = tOf(s), h = s.segs[0], p = s.prev[0] || h;
    return [px(lerp(p[0], h[0], t)), py(lerp(p[1], h[1], t))];
  }

  // the body as a polyline of interpolated cell centres, head first
  function bodyPoints(s) {
    const S = s.segs, P = s.prev, n = S.length, t = tOf(s);
    const pts = [headPx(s)];
    for (let i = 1; i < n; i++) pts.push([px(S[i][0]), py(S[i][1])]);
    const pt = P[P.length - 1], tl = S[n - 1];
    pts.push([px(lerp(pt[0], tl[0], t)), py(lerp(pt[1], tl[1], t))]);
    return pts;
  }

  function drawSnake(s, alpha) {
    const c = board.c;
    let pts = bodyPoints(s);
    const from = s.burst;
    if (from >= pts.length - 1) return;
    const n = pts.length;
    const dir = s.dir;
    if (mode === 'dying' && !s.demo) { pts[0] = [pts[0][0] + dir[0] * c * 0.28, pts[0][1] + dir[1] * c * 0.28]; }
    g.save();
    g.globalAlpha = alpha;
    g.lineCap = 'round'; g.lineJoin = 'round';
    // outer glow: one soft shadowed stroke under the whole body
    g.beginPath(); g.moveTo(pts[from][0], pts[from][1]);
    for (let i = from + 1; i < n; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.save();
    g.shadowColor = 'rgba(132,204,22,0.75)'; g.shadowBlur = c * 0.9;
    g.strokeStyle = '#064e3b'; g.lineWidth = c * 0.82; g.stroke();
    g.restore();
    // tapered tube in passes: dark rim, body, upper sheen, specular line
    const boost = (k) => { let b = 1; for (const w of s.waves) b += 0.3 * Math.exp(-((k - w) * (k - w)) / 3); return b; };
    const passes = [
      { w: 0.9, l: 18, sat: 75, a: 1, off: 0 },
      { w: 0.72, l: 40, sat: 85, a: 1, off: 0 },
      { w: 0.4, l: 58, sat: 90, a: 0.9, off: -0.07 },
      { w: 0.11, l: 92, sat: 100, a: 0.7, off: -0.15 },
    ];
    for (const ps of passes) {
      const o = ps.off * c;
      for (let k = Math.max(from, 0); k < n - 1; k++) {
        const f = k / Math.max(1, n - 2);
        const hue = lerp(84, 160, f);
        const b = boost(k);
        g.strokeStyle = `hsla(${hue},${ps.sat}%,${Math.min(96, ps.l + (b - 1) * 70)}%,${ps.a})`;
        g.lineWidth = c * ps.w * (1 - 0.38 * f) * b;
        g.beginPath(); g.moveTo(pts[k][0] + o, pts[k][1] + o); g.lineTo(pts[k + 1][0] + o, pts[k + 1][1] + o); g.stroke();
      }
    }
    // head
    if (from === 0) {
      const [hx, hy] = pts[0];
      const r = c * 0.54 * boost(0);
      const hg = g.createRadialGradient(hx - r * 0.3, hy - r * 0.35, r * 0.1, hx, hy, r);
      hg.addColorStop(0, '#f7fee7'); hg.addColorStop(0.35, '#bef264'); hg.addColorStop(1, '#4d7c0f');
      g.fillStyle = hg; g.beginPath(); g.arc(hx, hy, r, 0, 6.283); g.fill();
      // eyes look along the heading; they blink now and then
      const ex = -dir[1], ey = dir[0];
      const blink = (Math.sin(time * 1.3 + (s.demo ? 2 : 0)) > 0.985) ? 0.25 : 1;
      for (const sgn of [-1, 1]) {
        const x = hx + dir[0] * r * 0.25 + ex * sgn * r * 0.42, y = hy + dir[1] * r * 0.25 + ey * sgn * r * 0.42;
        g.fillStyle = '#04120c';
        g.beginPath(); g.ellipse(x, y, r * 0.2, r * 0.2 * blink, 0, 0, 6.283); g.fill();
        g.fillStyle = '#ecfccb';
        g.beginPath(); g.arc(x + dir[0] * r * 0.06 - r * 0.05, y + dir[1] * r * 0.06 - r * 0.05, r * 0.06, 0, 6.283); g.fill();
      }
    }
    g.restore();
  }

  function drawFood(s) {
    const c = board.c;
    if (s.food) {
      const x = px(s.food[0]), y = py(s.food[1]);
      const pulse = 1 + 0.13 * Math.sin(time * 6.5);
      g.save(); g.globalCompositeOperation = 'lighter';
      const gl = g.createRadialGradient(x, y, 0, x, y, c * 1.1);
      gl.addColorStop(0, 'rgba(190,242,100,0.55)'); gl.addColorStop(1, 'rgba(190,242,100,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(x, y, c * 1.1, 0, 6.283); g.fill();
      // expanding ring
      const rp = (time * 0.9) % 1;
      g.strokeStyle = `rgba(217,249,157,${0.5 * (1 - rp)})`; g.lineWidth = Math.max(1, c * 0.06);
      g.beginPath(); g.arc(x, y, c * (0.3 + rp * 0.55), 0, 6.283); g.stroke();
      g.restore();
      const core = g.createRadialGradient(x - c * 0.08, y - c * 0.1, 0, x, y, c * 0.3 * pulse);
      core.addColorStop(0, '#ffffff'); core.addColorStop(0.5, '#d9f99d'); core.addColorStop(1, '#65a30d');
      g.fillStyle = core; g.beginPath(); g.arc(x, y, c * 0.28 * pulse, 0, 6.283); g.fill();
    }
    if (s.gold) {
      const x = px(s.gold.p[0]), y = py(s.gold.p[1]);
      const left = s.gold.life / GOLD_LIFE;
      const appear = clamp((GOLD_LIFE - s.gold.life) * 5, 0, 1);
      const blinkOff = s.gold.life < 1.6 && Math.sin(time * 26) < -0.2;
      const r = c * 0.32 * appear * (1 + 0.1 * Math.sin(time * 9));
      g.save(); g.globalCompositeOperation = 'lighter';
      const gl = g.createRadialGradient(x, y, 0, x, y, c * 1.4);
      gl.addColorStop(0, 'rgba(251,191,36,0.6)'); gl.addColorStop(1, 'rgba(251,191,36,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(x, y, c * 1.4 * appear, 0, 6.283); g.fill();
      // sparkles orbiting
      for (let i = 0; i < 3; i++) {
        const a = time * 2.4 + i * 2.094;
        g.fillStyle = 'rgba(254,243,199,0.9)';
        g.beginPath(); g.arc(x + Math.cos(a) * c * 0.62, y + Math.sin(a) * c * 0.62, c * 0.05, 0, 6.283); g.fill();
      }
      g.restore();
      // countdown ring
      g.strokeStyle = 'rgba(253,230,138,0.85)'; g.lineWidth = Math.max(1.5, c * 0.07); g.lineCap = 'round';
      g.beginPath(); g.arc(x, y, c * 0.48, -Math.PI / 2, -Math.PI / 2 + 6.283 * left); g.stroke();
      if (!blinkOff) {
        // a faceted gem
        g.save(); g.translate(x, y); g.rotate(time * 0.8);
        const gg = g.createLinearGradient(-r, -r, r, r);
        gg.addColorStop(0, '#fffbeb'); gg.addColorStop(0.45, '#fbbf24'); gg.addColorStop(1, '#b45309');
        g.fillStyle = gg; g.beginPath();
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.62 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        g.closePath(); g.fill(); g.restore();
      }
    }
  }

  function drawFx() {
    const c = board.c;
    g.save(); g.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      const k = 1 - p.life / p.max;
      g.fillStyle = `hsla(${p.hue},90%,${55 + 25 * k}%,${k})`;
      g.beginPath(); g.arc(px(p.x - 0.5), py(p.y - 0.5), Math.max(0.5, c * p.size * (0.4 + k)), 0, 6.283); g.fill();
    }
    g.restore();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const p of pops) {
      const k = p.life, e = 1 - Math.pow(1 - Math.min(1, k * 3), 3);
      const x = px(p.x - 0.5), y = py(p.y - 0.5) - c * (0.4 + e * 1.1);
      g.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
      const fs = Math.max(12, c * 0.75) * (k < 0.12 ? 0.6 + k * 3.3 : 1);
      g.font = `800 ${fs}px ${FONT}`;
      g.lineWidth = Math.max(2, fs * 0.16); g.strokeStyle = 'rgba(3,7,18,0.85)';
      g.strokeText(p.text, x, y); g.fillStyle = p.color; g.fillText(p.text, x, y);
      if (p.sub) {
        g.font = `700 ${fs * 0.5}px ${FONT}`;
        g.strokeText(p.sub, x, y + fs * 0.7); g.fillStyle = '#ecfccb'; g.fillText(p.sub, x, y + fs * 0.7);
      }
      g.globalAlpha = 1;
    }
  }

  function drawHud() {
    const y = hud.y + hud.h * 0.48, fs = clamp(hud.h * 0.42, 15, 28);
    const lx = board.x + 4, rx = board.x + board.s - 4;
    g.textBaseline = 'middle';
    g.font = `600 ${fs * 0.48}px ${MONO}`; g.fillStyle = 'rgba(190,242,100,0.7)';
    g.textAlign = 'left'; g.fillText('SCORE', lx, y - fs * 0.55);
    g.textAlign = 'right'; g.fillText('BEST', rx, y - fs * 0.55);
    g.font = `800 ${fs}px ${MONO}`; g.fillStyle = '#ecfccb';
    g.textAlign = 'left'; g.fillText(String(mode === 'attract' ? 0 : score).padStart(5, '0'), lx, y + fs * 0.3);
    g.textAlign = 'right'; g.fillStyle = '#a3e635'; g.fillText(String(best).padStart(5, '0'), rx, y + fs * 0.3);
    if (game && mode !== 'attract') {
      g.textAlign = 'center'; g.font = `600 ${fs * 0.48}px ${MONO}`; g.fillStyle = 'rgba(190,242,100,0.7)';
      g.fillText('LENGTH', W / 2, y - fs * 0.55);
      g.font = `800 ${fs * 0.8}px ${MONO}`; g.fillStyle = '#d9f99d';
      g.fillText(String(game.segs.length), W / 2, y + fs * 0.3);
    }
    if (muted) {
      g.textAlign = 'center'; g.font = `600 ${Math.max(10, fs * 0.42)}px ${MONO}`; g.fillStyle = 'rgba(236,252,203,0.45)';
      g.fillText('SOUND OFF · M', W / 2, Math.min(H - 10, board.y + board.s + clamp(H * 0.02, 8, 16)));
    }
  }

  function glowText(text, x, y, size, color, glow, weight = 900) {
    g.font = `${weight} ${size}px ${FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.shadowColor = glow; g.shadowBlur = size * 0.35; g.fillStyle = color; g.fillText(text, x, y); g.restore();
    g.fillStyle = color; g.fillText(text, x, y);
  }

  function veil(a) {
    g.save(); roundRect(g, board.x, board.y, board.s, board.s, board.c * 0.7);
    g.fillStyle = `rgba(3,8,24,${a})`; g.fill(); g.restore();
  }

  function drawOverlay() {
    const cx = W / 2, cy = board.y + board.s / 2, S = board.s;
    const blinkA = 0.55 + 0.45 * Math.sin(time * 4);
    if (mode === 'attract') {
      veil(0.3);
      const bob = reduced ? 0 : Math.sin(time * 2) * S * 0.01;
      glowText('COIL', cx, cy - S * 0.13 + bob, S * 0.2, '#ecfccb', '#84cc16');
      g.font = `600 ${S * 0.038}px ${FONT}`; g.fillStyle = '#a7f3d0';
      g.fillText('Glide. Grow. Never touch the wall.', cx, cy + S * 0.0);
      g.globalAlpha = blinkA;
      const cta = IC.standalone ? (coarse ? 'Tap to start' : 'Press Enter to start') : 'Press start';
      glowText(cta.toUpperCase(), cx, cy + S * 0.12, S * 0.05, '#d9f99d', '#65a30d', 800);
      g.globalAlpha = 1;
      g.font = `500 ${S * 0.03}px ${FONT}`; g.fillStyle = 'rgba(209,250,229,0.75)';
      const hint = coarse ? 'Swipe to steer · golden pellets fade fast' : 'Arrows / WASD to steer · Space pauses · M mutes';
      g.fillText(hint, cx, cy + S * 0.22);
    } else if (mode === 'play' && game && game.startDelay > 0) {
      const k = game.startDelay;
      glowText(k > 0.35 ? 'READY' : 'GO!', cx, cy - S * 0.18, S * (k > 0.35 ? 0.08 : 0.11), '#ecfccb', '#84cc16');
    } else if (mode === 'play' && paused) {
      veil(0.6);
      glowText('PAUSED', cx, cy - S * 0.04, S * 0.1, '#ecfccb', '#84cc16');
      g.globalAlpha = blinkA;
      g.font = `600 ${S * 0.04}px ${FONT}`; g.fillStyle = '#d9f99d';
      g.fillText(coarse ? 'Tap to continue' : 'Press any key to continue', cx, cy + S * 0.07);
      g.globalAlpha = 1;
    } else if (mode === 'over') {
      const e = 1 - Math.pow(1 - Math.min(1, overT * 2.5), 3);
      veil(0.6 * e);
      g.globalAlpha = e;
      const y0 = cy - S * 0.1 + (1 - e) * S * 0.05;
      glowText('GAME OVER', cx, y0 - S * 0.06, S * 0.09, '#fecaca', '#ef4444');
      glowText(String(score), cx, y0 + S * 0.08, S * 0.13, '#ecfccb', '#84cc16');
      g.font = `600 ${S * 0.034}px ${FONT}`; g.fillStyle = '#a7f3d0';
      g.fillText(newBest && score > 0 ? 'NEW BEST!' : 'Best ' + best + ' · length ' + game.segs.length, cx, y0 + S * 0.19);
      if (overT > 0.6) {
        g.globalAlpha = e * blinkA;
        const cta = IC.standalone ? (coarse ? 'Tap to play again' : 'Press Enter to play again') : 'Press start to play again';
        g.font = `700 ${S * 0.04}px ${FONT}`; g.fillStyle = '#d9f99d';
        g.fillText(cta, cx, y0 + S * 0.3);
      }
      g.globalAlpha = 1;
    }
  }

  function render() {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.drawImage(bg, 0, 0, W, H);
    const sk = shake * (reduced ? 0.2 : 1);
    g.save();
    if (sk > 0.01) g.translate(rnd(-sk, sk), rnd(-sk, sk));
    const s = mode === 'attract' ? demo : game;
    if (s) {
      g.save(); roundRect(g, board.x, board.y, board.s, board.s, board.c * 0.7); g.clip();
      drawFood(s);
      drawSnake(s, 1);
      g.restore();
    }
    drawFx();
    if (mode === 'dying' || mode === 'over') {
      // the wall flares red where the run ended
      const k = mode === 'dying' ? 1 : Math.max(0, 1 - overT);
      g.save(); g.globalAlpha = 0.8 * k; g.lineWidth = Math.max(2, board.c * 0.14); g.strokeStyle = '#f87171';
      roundRect(g, board.x, board.y, board.s, board.s, board.c * 0.7); g.stroke(); g.restore();
    }
    g.restore();
    drawHud();
    drawOverlay();
    if (flash > 0 && !reduced) { g.fillStyle = `rgba(${flashColor},${flash * 0.35})`; g.fillRect(0, 0, W, H); }
  }

  // ---------------------------------------------------------------- loop
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    dt = clamp(dt, 0, 0.05);
    time += dt;
    if (hitStop > 0) { hitStop -= dt; }
    else {
      if (mode === 'attract') tick(demo, dt);
      else if (mode === 'play' && !paused) tick(game, dt);
      else if (mode === 'dying') {
        dyingT += dt;
        // segments burst one by one from the head down
        const target = Math.min(game.segs.length + 1, Math.floor(dyingT / 0.035));
        while (game.burst < target) {
          const p = game.segs[Math.min(game.burst, game.segs.length - 1)];
          burst(p[0], p[1], 5, lerp(84, 158, game.burst / Math.max(1, game.segs.length)), 0.9);
          sfx.pop(game.burst);
          game.burst++;
        }
        if (game.burst > game.segs.length && dyingT > 0.9) { mode = 'over'; overT = 0; }
      } else if (mode === 'over') overT += dt;
      updateFx(dt);
    }
    render();
    requestAnimationFrame(frame);
  }

  layout();
  demo = makeGame(true);
  requestAnimationFrame((t) => { last = t; frame(t); });
  IC.ready();
})();
</script>
</body>
</html>
