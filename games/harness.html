<!doctype html>
<!--
  Dev harness: plays a starter game the way the arcade does, in a sandboxed
  iframe (no allow-same-origin) with the SDK injected ahead of the game.
  Serve the repo root (python3 -m http.server 8765) and open
  http://localhost:8765/games/harness.html?game=coil
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Insert Coin harness</title>
<style>
body{margin:0;background:#111;color:#eee;font:14px system-ui;display:flex;flex-direction:column;height:100vh}
#bar{display:flex;gap:8px;padding:8px;align-items:center;flex-wrap:wrap}
#wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
iframe{border:0;background:#000;width:100%;height:100%}
#log{height:120px;overflow:auto;font:12px ui-monospace,monospace;background:#000;padding:6px;white-space:pre}
</style></head><body>
<div id="bar"><b id="name"></b><button id="start">Start</button><button id="mute">Mute</button><span id="status"></span></div>
<div id="wrap"><iframe id="f" sandbox="allow-scripts allow-pointer-lock" allow="autoplay; fullscreen; gamepad"></iframe></div>
<div id="log"></div>
<script>
const game = new URLSearchParams(location.search).get('game') || 'coil';
const f = document.getElementById('f'), log = (s) => { const l = document.getElementById('log'); l.textContent += s + '\n'; l.scrollTop = 1e9; };
let muted = false;
document.getElementById('name').textContent = game;
Promise.all([fetch('../assets/sdk/insertcoin.js').then(r => r.text()), fetch(game + '/index.html').then(r => r.text())]).then(([sdk, html]) => {
  f.srcdoc = html.replace(/<head[^>]*>/i, (m) => m + '<script>' + sdk + '<\/script>');
});
const post = (type, data) => f.contentWindow.postMessage({ insertcoin: 1, type, data: data || {} }, '*');
addEventListener('message', (e) => {
  if (e.source !== f.contentWindow || !e.data || e.data.insertcoin !== 1) return;
  log(new Date().toLocaleTimeString() + ' ← ' + e.data.type + ' ' + JSON.stringify(e.data.data));
  if (e.data.type === 'ready') post('init', { muted });
  if (e.data.type === 'over') document.getElementById('status').textContent = 'Game over: ' + JSON.stringify(e.data.data);
});
document.getElementById('start').onclick = () => { post('start'); f.focus(); document.getElementById('status').textContent = 'playing'; };
document.getElementById('mute').onclick = () => { muted = !muted; post('mute', { muted }); document.getElementById('mute').textContent = muted ? 'Unmute' : 'Mute'; };
</script></body></html>
