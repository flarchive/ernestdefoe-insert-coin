<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rock Belt</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02040a;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<script>
/* Rock Belt: an original vector-glow rock shooter for Insert Coin. MIT. */
(() => {
'use strict';
const IC = window.InsertCoin || { standalone: true, muted: false, ready() {}, gameOver() {}, submitScore() {}, on() {} };

// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; return [c, x]; };
const [bH, bhx] = mk(), [bA, bax] = mk(), [bB, bbx] = mk(), [bg, bgx] = mk();
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const TAU = Math.PI * 2, STEP = 1 / 120;
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
const ROUND = 'ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = (a) => a[(Math.random() * a.length) | 0];
const angDiff = (a, b) => ((((a - b + Math.PI) % TAU) + TAU) % TAU) - Math.PI;
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const ORANGE = ['#ff8a2a', '#ffb35c', '#ffd9a0', '#ff5a1f'];
const BLUE = ['#bfe4ff', '#7cc6ff', '#ffffff'];

let cssW = 1, cssH = 1, dpr = 1, scale = 1, W = 1, H = 1;
let stars = [];
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = Math.max(1, innerWidth); cssH = Math.max(1, innerHeight);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssW, cssH) / 640; // the short side is always 640 world units
  W = cssW / scale; H = cssH / scale;
  bH.width = Math.max(1, cv.width >> 1); bH.height = Math.max(1, cv.height >> 1);
  bA.width = Math.max(1, cv.width >> 2); bA.height = Math.max(1, cv.height >> 2);
  bB.width = Math.max(1, cv.width >> 3); bB.height = Math.max(1, cv.height >> 3);
  // background: deep space, two faint nebulae and a vignette (half resolution, it is soft anyway)
  bg.width = Math.max(1, cv.width >> 1); bg.height = Math.max(1, cv.height >> 1);
  const w = bg.width, h = bg.height, m = Math.max(w, h);
  bgx.fillStyle = '#02040a'; bgx.fillRect(0, 0, w, h);
  const blob = (x, y, r, c) => { const g = bgx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); bgx.fillStyle = g; bgx.fillRect(0, 0, w, h); };
  blob(w * 0.22, h * 0.3, m * 0.55, 'rgba(18,52,120,0.38)');
  blob(w * 0.8, h * 0.75, m * 0.45, 'rgba(10,40,96,0.32)');
  blob(w * 0.68, h * 0.18, m * 0.25, 'rgba(90,40,12,0.16)');
  const v = bgx.createRadialGradient(w / 2, h / 2, m * 0.2, w / 2, h / 2, m * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)');
  bgx.fillStyle = v; bgx.fillRect(0, 0, w, h);
  const n = Math.min(420, Math.round((cssW * cssH) / 2600));
  stars = [];
  for (let i = 0; i < n; i++) stars.push({ x: Math.random(), y: Math.random(), z: rnd(0.12, 1), p: rnd(0, TAU) });
}
addEventListener('resize', resize);
resize();

// ---------- audio (all synthesised) ----------
let ac = null, master = null, noiseBuf = null, thrustG = null, humG = null, humOsc = null;
let muted = !!IC.muted;
function audio() {
  if (!ac) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.55;
      const comp = ac.createDynamicsCompressor();
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      // engine rumble: looped filtered noise, gain follows the throttle
      const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 360; f.Q.value = 0.7;
      thrustG = ac.createGain(); thrustG.gain.value = 0;
      n.connect(f); f.connect(thrustG); thrustG.connect(master); n.start();
      // saucer warble: triangle wobbled by an LFO
      humOsc = ac.createOscillator(); humOsc.type = 'triangle'; humOsc.frequency.value = 520;
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 6.5; lg.gain.value = 80;
      lfo.connect(lg); lg.connect(humOsc.frequency);
      humG = ac.createGain(); humG.gain.value = 0;
      humOsc.connect(humG); humG.connect(master); humOsc.start(); lfo.start();
    } catch (e) { ac = null; return; }
  }
  if (ac.state !== 'running') { try { ac.resume().catch(() => {}); } catch (e) {} }
}
function setMuted(m) {
  muted = !!m;
  if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.55, ac.currentTime, 0.02);
}
const quiet = () => !ac || muted || state === 'attract';
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (quiet()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function hiss(dur, vol, f0, f1, delay = 0) {
  if (quiet()) return;
  const t = ac.currentTime + delay, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.playbackRate.value = rnd(0.8, 1.2);
  f.type = 'lowpass'; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const sfx = {
  fire() { tone('square', 1300, 340, 0.08, 0.05); tone('sine', 2600, 900, 0.05, 0.03); },
  efire() { tone('sawtooth', 760, 190, 0.16, 0.035); },
  rock(s) { hiss(0.16 + s * 0.13, 0.22 + s * 0.07, 3200 - s * 700, 110); if (s === 3) tone('sine', 110, 38, 0.32, 0.25); },
  boom() { hiss(0.7, 0.45, 2400, 80); tone('sawtooth', 380, 40, 0.6, 0.12); tone('sine', 90, 30, 0.6, 0.3); },
  death() { hiss(1.3, 0.55, 3000, 60); tone('sawtooth', 600, 35, 1.1, 0.14); tone('sine', 80, 25, 0.9, 0.35); },
  shield() { tone('sine', 300, 1300, 0.28, 0.12); tone('triangle', 650, 2500, 0.24, 0.05); },
  deflect() { tone('sine', 1100, 520, 0.1, 0.07); },
  ready() { tone('sine', 1500, 1600, 0.07, 0.04); tone('sine', 2000, 2100, 0.07, 0.03, 0.07); },
  life() { [660, 880, 1100, 1320, 1760].forEach((f, i) => tone('square', f, f, 0.09, 0.05, i * 0.07)); },
  wave() { tone('triangle', 220, 440, 0.25, 0.08); tone('triangle', 330, 660, 0.25, 0.06, 0.12); },
  beat(hi) { tone('sine', hi ? 72 : 60, 34, 0.14, 0.22); },
  start() { [330, 495, 660].forEach((f, i) => tone('triangle', f, f * 1.01, 0.14, 0.07, i * 0.08)); },
  over() { [523, 392, 294, 196].forEach((f, i) => tone('triangle', f, f * 0.97, 0.26, 0.08, i * 0.17)); },
};

// ---------- game state ----------
const ROCK_R = [0, 13, 25, 46], ROCK_PTS = [0, 100, 50, 20], MASS = [0, 1, 3, 7];
const SHIELD_T = 1.8, SHIELD_CD = 6, MAX_SHOTS = 6, MAX_FX = 900;
let state = 'attract', paused = false, overSent = false;
let score = 0, best = 0, lives = 3, wave = 0, nextLife = 10000, newBest = false;
let ship = null, rocks = [], bullets = [], saucer = null;
let sparks = [], debris = [], rings = [], flares = [], pops = [], banners = [];
let waveT = 0, saucerT = 0, respawnT = 0, overT = 0, hitStop = 0, shake = 0, flash = 0;
let beatT = 0, beatHi = false, waveMass = 1, chain = 0, chainT = 0, time = 0, starOX = 0, starOY = 0;

function makeShip(demo) {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, r: 10, alive: true, inv: demo ? 0 : 2.5,
    shield: 0, shCd: 0, fireCd: 0, thr: 0, emit: 0, demo: !!demo };
}
function makeRock(size, x, y, mul) {
  const n = size === 3 ? 12 : size === 2 ? 10 : 8, shape = [];
  for (let i = 0; i < n; i++) shape.push(rnd(0.72, 1.08));
  const sp = [0, rnd(80, 140), rnd(50, 95), rnd(28, 60)][size] * mul, a = rnd(0, TAU);
  return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: ROCK_R[size] * rnd(0.92, 1.08), size, shape,
    a: rnd(0, TAU), spin: rnd(-1, 1) * (1.5 / size), hit: 0 };
}
const speedMul = () => 1 + Math.min(wave - 1, 18) * 0.055;
function spawnRocks(n, mul) {
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do { // start on the edges, never on top of the ship
      if (Math.random() < 0.5) { x = rnd(0, W); y = Math.random() < 0.5 ? rnd(0, 60) : H - rnd(0, 60); }
      else { y = rnd(0, H); x = Math.random() < 0.5 ? rnd(0, 60) : W - rnd(0, 60); }
    } while (ship && ship.alive && Math.hypot(wd(x - ship.x, W), wd(y - ship.y, H)) < 240 && ++tries < 30);
    rocks.push(makeRock(3, x, y, mul));
  }
}
function spawnWave() {
  wave++;
  const n = Math.min(3 + wave, 12);
  spawnRocks(n, speedMul());
  waveMass = n * MASS[3];
  banners.push({ text: 'WAVE ' + wave, sub: wave === 1 ? 'clear the belt' : '', t: 0 });
  sfx.wave();
}
function newRun() {
  audio();
  state = 'play'; paused = false; overSent = false; newBest = false;
  score = 0; lives = 3; wave = 0; nextLife = 10000;
  rocks = []; bullets = []; saucer = null; sparks = []; debris = []; rings = []; flares = []; pops = []; banners = [];
  ship = makeShip(false);
  waveT = 0; respawnT = 0; overT = 0; hitStop = 0; chain = 0; beatT = 1;
  saucerT = rnd(16, 22);
  spawnWave();
  sfx.start();
}
function attract() {
  state = 'attract';
  rocks = []; bullets = []; saucer = null;
  ship = makeShip(true);
  spawnRocks(6, 1);
}
const canStart = () => state === 'attract' || (state === 'over' && overT > 0.8);

// wrapped deltas for a field that loops at the edges
function wd(d, s) { return d > s / 2 ? d - s : d < -s / 2 ? d + s : d; }
function near(a, b, r) { const dx = wd(a.x - b.x, W), dy = wd(a.y - b.y, H); return dx * dx + dy * dy < r * r; }
function wrap(o) { o.x = ((o.x % W) + W) % W; o.y = ((o.y % H) + H) % H; }

// ---------- effects ----------
function spark(x, y, vx, vy, life, c, w) { if (sparks.length < MAX_FX) sparks.push({ x, y, vx, vy, life, max: life, c, w }); }
function burst(x, y, n, sp, cols, life, bvx = 0, bvy = 0) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = sp * Math.pow(Math.random(), 0.6);
    spark(x, y, bvx + Math.cos(a) * s, bvy + Math.sin(a) * s, rnd(life * 0.5, life), pick(cols), rnd(1.5, 3));
  }
}
function lineBits(x, y, pts, vx, vy, c, sp) {
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length], mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    const out = Math.atan2(my, mx), s = rnd(sp * 0.4, sp);
    debris.push({ x: x + mx, y: y + my, vx: vx + Math.cos(out) * s, vy: vy + Math.sin(out) * s,
      a: Math.atan2(q[1] - p[1], q[0] - p[0]), len: Math.hypot(q[0] - p[0], q[1] - p[1]), spin: rnd(-7, 7),
      life: rnd(0.6, 1.2), max: 1.2, c });
  }
}
function rockPts(k) {
  const n = k.shape.length, pts = [];
  for (let i = 0; i < n; i++) { const a = k.a + (i / n) * TAU, r = k.r * k.shape[i]; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return pts;
}
const SHIP_PTS = [[16, 0], [-11, 10], [-6, 0], [-11, -10]];
function shipPts(a) { const c = Math.cos(a), s = Math.sin(a); return SHIP_PTS.map(([x, y]) => [x * c - y * s, x * s + y * c]); }
function flare(x, y, r, life) { flares.push({ x, y, r, life, max: life }); } // hot core of a blast
function addShake(v) { shake = Math.min(20, shake + v); }
function pop(x, y, text, c) { pops.push({ x, y, text, c, t: 0 }); }

function addScore(p, x, y) {
  if (state !== 'play') return;
  score += p;
  pop(x, y, '+' + p, p >= 200 ? '#ffb35c' : '#dff1ff');
  while (score >= nextLife) {
    nextLife += 10000; lives++;
    banners.push({ text: 'EXTRA LIFE', sub: '', t: 0, c: '#ffb35c' });
    sfx.life();
  }
}
function breakRock(j, award, src) {
  const k = rocks[j];
  rocks.splice(j, 1);
  if (award && state === 'play') {
    addScore(ROCK_PTS[k.size], k.x, k.y);
    chain++; chainT = 1.4;
    if (chain >= 5 && chain % 5 === 0) pop(k.x, k.y - 22, 'CHAIN ×' + chain, '#ffd9a0');
  }
  burst(k.x, k.y, 8 + k.size * 9, 60 + k.size * 45, ORANGE, 0.55 + k.size * 0.12, k.vx * 0.5, k.vy * 0.5);
  burst(k.x, k.y, 4 + k.size * 3, 80, BLUE, 0.5, k.vx * 0.5, k.vy * 0.5);
  lineBits(k.x, k.y, rockPts(k), k.vx * 0.6, k.vy * 0.6, '#9fd6ff', 40 + k.size * 15);
  flare(k.x, k.y, k.r * 0.9, 0.22 + k.size * 0.05);
  if (k.size === 3) rings.push({ x: k.x, y: k.y, r: 8, vr: 260, life: 0.4, max: 0.4, c: '#ff9a40' });
  addShake(k.size * 2.2);
  sfx.rock(k.size);
  if (k.size > 1) {
    const mul = speedMul() * (state === 'attract' ? 1 : 1.05);
    for (let i = 0; i < 2; i++) {
      const c = makeRock(k.size - 1, k.x, k.y, mul);
      c.vx += k.vx * 0.4 + (src ? src.vx * 0.04 : 0); c.vy += k.vy * 0.4 + (src ? src.vy * 0.04 : 0);
      c.hit = 0.12;
      rocks.push(c);
    }
  }
}
function killSaucer(award) {
  const u = saucer;
  if (award) addScore(u.small ? 1000 : 200, u.x, u.y);
  burst(u.x, u.y, 60, 230, ORANGE, 0.9, u.vx * 0.3, u.vy * 0.3);
  burst(u.x, u.y, 20, 150, BLUE, 0.7);
  lineBits(u.x, u.y, saucerPts(u), u.vx * 0.3, u.vy * 0.3, '#dff1ff', 120);
  rings.push({ x: u.x, y: u.y, r: 10, vr: 380, life: 0.5, max: 0.5, c: '#ffb35c' });
  flare(u.x, u.y, 46, 0.4);
  addShake(9); hitStop = 0.06; sfx.boom();
  saucer = null; saucerT = Math.max(6, 17 - wave * 0.8) + rnd(0, 6);
}
function killShip() {
  const s = ship;
  s.alive = false;
  burst(s.x, s.y, 90, 280, ORANGE, 1.1, s.vx * 0.3, s.vy * 0.3);
  burst(s.x, s.y, 30, 200, BLUE, 0.9);
  lineBits(s.x, s.y, shipPts(s.a), s.vx * 0.4, s.vy * 0.4, '#ffffff', 90);
  rings.push({ x: s.x, y: s.y, r: 6, vr: 420, life: 0.6, max: 0.6, c: '#ff8a2a' });
  flare(s.x, s.y, 60, 0.5);
  addShake(16); hitStop = 0.12; flash = 1; chain = 0;
  sfx.death();
  lives--;
  if (lives <= 0) {
    state = 'over'; overT = 0;
    if (score > best) { best = score; newBest = score > 0; }
    if (!overSent) { overSent = true; IC.gameOver(score); }
    sfx.over();
  } else respawnT = 1.6;
}
function spawnSaucer() {
  const small = Math.random() < clamp((score - 6000) / 30000 + (wave - 3) * 0.06, 0, 0.85);
  const dir = Math.random() < 0.5 ? 1 : -1, sp = (small ? 150 : 105) * (1 + Math.min(wave, 15) * 0.02);
  saucer = { x: dir > 0 ? -30 : W + 30, y: rnd(H * 0.15, H * 0.85), vx: dir * sp, vy: 0, small, r: small ? 12 : 21, fire: 1.2, turn: rnd(0.6, 1.4), t: 0 };
}
function saucerPts(u) {
  const r = u.r;
  return [[-r, 0], [-r * 0.45, r * 0.38], [r * 0.45, r * 0.38], [r, 0], [r * 0.45, -r * 0.3], [-r * 0.45, -r * 0.3]];
}
function saucerShoot(u) {
  let a;
  const dx = wd(ship.x - u.x, W), dy = wd(ship.y - u.y, H);
  if (u.small) a = Math.atan2(dy, dx) + rnd(-1, 1) * Math.max(0.05, 0.38 - score / 120000 - wave * 0.012);
  else a = Math.random() < 0.35 ? Math.atan2(dy, dx) + rnd(-0.4, 0.4) : rnd(0, TAU);
  const sp = 330 + Math.min(wave, 15) * 6;
  bullets.push({ x: u.x + Math.cos(a) * u.r, y: u.y + Math.sin(a) * u.r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.3, enemy: true });
  sfx.efire();
}

// ---------- input ----------
const keys = {};
const mouse = { fire: false, thrust: false, wx: 0, wy: 0, aimUntil: 0 };
const STICK_R = 56, stick = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, tp = new Map();
let touchMode = coarse, touchFire = false, touchShield = false;
function btns() {
  const r = clamp(Math.min(cssW, cssH) * 0.11, 34, 52);
  const fire = { x: cssW - r - 22, y: cssH - r - 28, r };
  return { fire, sh: { x: fire.x - r * 1.55, y: fire.y - r * 1.45, r: r * 0.7 } };
}
function gesture() { audio(); }
function resume() { paused = false; last = performance.now(); }
function syncTouch() { touchFire = false; touchShield = false; for (const v of tp.values()) { if (v === 'fire') touchFire = true; else touchShield = true; } }
addEventListener('keydown', (e) => {
  gesture();
  const k = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
  if (k === 'KeyM') { if (!e.repeat) setMuted(!muted); return; }
  if (paused) { if (!e.repeat) resume(); return; }
  if ((k === 'KeyP' || k === 'Escape') && state === 'play' && !e.repeat) { paused = true; return; }
  if (IC.standalone && (k === 'Enter' || k === 'Space') && !e.repeat && canStart()) { newRun(); return; }
  keys[k] = true;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD') mouse.aimUntil = 0;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.fire = mouse.thrust = false; });
function mouseAt(e) { mouse.wx = e.clientX / scale; mouse.wy = e.clientY / scale; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault(); gesture();
  try { cv.focus({ preventScroll: true }); } catch (err) {}
  if (paused) { resume(); return; }
  if (IC.standalone && canStart()) newRun();
  if (e.pointerType === 'mouse') {
    touchMode = false; mouseAt(e);
    if (e.button === 0) mouse.fire = true; else if (e.button === 2) mouse.thrust = true;
    return;
  }
  touchMode = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (e.clientX < cssW / 2) {
    if (stick.id === null) { stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY; }
  } else {
    const { sh } = btns();
    tp.set(e.pointerId, Math.hypot(e.clientX - sh.x, e.clientY - sh.y) < sh.r * 1.35 ? 'shield' : 'fire');
    syncTouch();
  }
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'mouse') { mouseAt(e); mouse.aimUntil = time + 2.5; return; }

    ctx.fillStyle = `rgba(120,190,255,${on ? 0.22 : 0.08 * a})`; ctx.fill();
    ctx.strokeStyle = `rgba(170,215,255,${on ? 0.7 : 0.32 * a})`; ctx.lineWidth = 2; ctx.stroke();
  };
  if (stick.id !== null) {
    ring(stick.ox, stick.oy, STICK_R, false, 1.2);
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, d = Math.hypot(dx, dy), m = Math.min(1, STICK_R / (d || 1));
    ring(stick.ox + dx * Math.min(1, m), stick.oy + dy * Math.min(1, m), 24, true, 1);
  } else {
    const gx = Math.min(cssW * 0.2, 130), gy = cssH - Math.min(cssH * 0.16, 110);
    ring(gx, gy, STICK_R * 0.8, false, 0.7); ring(gx, gy, 18, false, 0.7);
  }
  ring(fire.x, fire.y, fire.r, touchFire, 1);
  const shReady = ship && ship.alive && ship.shCd <= 0;
  ring(sh.x, sh.y, sh.r, touchShield || (ship && ship.shield > 0), shReady ? 1.3 : 0.6);
  if (ship && !shReady && ship.shield <= 0) {
    ctx.beginPath(); ctx.arc(sh.x, sh.y, sh.r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - ship.shCd / (SHIELD_T + SHIELD_CD)));
    ctx.strokeStyle = 'rgba(124,198,255,0.55)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(220,238,255,0.75)';
  ctx.font = `700 ${Math.round(fire.r * 0.32)}px ${ROUND}`; ctx.fillText('FIRE', fire.x, fire.y);
  ctx.font = `700 ${Math.round(sh.r * 0.34)}px ${ROUND}`; ctx.fillText('SHIELD', sh.x, sh.y);
}
function dim(a) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(2,4,10,${a})`; ctx.fillRect(0, 0, cv.width, cv.height); }
function lines(arr, y, size, color, gap) {
  ctx.font = `600 ${size}px ${ROUND}`; ctx.fillStyle = color;
  arr.forEach((t, i) => ctx.fillText(t, cssW / 2, y + i * size * gap));
}
function drawOverlay() {
  const touch = touchMode || coarse, cx = cssW / 2;
  const T = Math.round(clamp(Math.min(cssW * 0.13, cssH * 0.16), 40, 120));
  const blink = 0.7 + 0.3 * Math.sin(time * 4);
  const startHint = IC.standalone ? (touch ? 'TAP TO START' : 'PRESS ENTER OR CLICK TO START') : 'PRESS START';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'attract') {
    dim(0.35); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if ('letterSpacing' in ctx) ctx.letterSpacing = Math.round(T * 0.08) + 'px';
    glowText('ROCK BELT', cx, cssH * 0.34, T, '#f2f9ff', '#2f8cff', 900);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    const sub = Math.round(clamp(T * 0.2, 13, 20));
    ctx.font = `600 ${sub}px ${ROUND}`; ctx.fillStyle = '#ffb35c';
    ctx.fillText('SPLIT THE ROCKS · DODGE THE SAUCERS', cx, cssH * 0.34 + T * 0.72);
    ctx.globalAlpha = blink; glowText(startHint, cx, cssH * 0.6, Math.round(sub * 1.15), '#bfe4ff', '#3a9dff', 800); ctx.globalAlpha = 1;
    const hs = Math.round(clamp(cssW * 0.018, 12, 15)), narrow = cssW < 620;
    const hint = touch
      ? (narrow ? ['LEFT THUMB: STEER + THRUST', 'RIGHT THUMB: FIRE · SHIELD'] : ['LEFT THUMB: STEER + THRUST   ·   RIGHT THUMB: FIRE · SHIELD'])
      : (narrow ? ['← → / A D  ROTATE   ↑ / W  THRUST', 'SPACE  FIRE   SHIFT / ↓  SHIELD', 'MOUSE: AIM · CLICK FIRE · M MUTE']
        : ['← → / A D  ROTATE    ↑ / W  THRUST    SPACE  FIRE    SHIFT / ↓  SHIELD', 'MOUSE: AIM · LEFT FIRE · RIGHT THRUST    ·    M  MUTE    ·    P  PAUSE']);
    lines(hint, cssH * 0.74, hs, '#7fa9d6', 1.8);
    if (best > 0) { ctx.font = `700 ${hs}px ${MONO}`; ctx.fillStyle = '#9fd6ff'; ctx.fillText('BEST ' + fmt(best), cx, cssH * 0.74 + hint.length * hs * 1.8 + hs); }
  } else if (state === 'over' && overT > 0.6) {
    const a = Math.min(1, (overT - 0.6) * 2.5);
    dim(0.45 * a); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalAlpha = a;
    glowText('GAME OVER', cx, cssH * 0.36, Math.round(T * 0.75), '#ffd9a0', '#ff6a1f', 900);
    glowText(fmt(score), cx, cssH * 0.36 + T * 0.85, Math.round(T * 0.5), '#f2f9ff', '#3a9dff', 700, MONO);
    const sub = Math.round(clamp(T * 0.18, 13, 19));
    ctx.font = `700 ${sub}px ${MONO}`; ctx.fillStyle = newBest ? '#ffb35c' : '#7fa9d6';
    ctx.fillText(newBest ? 'NEW BEST!' : 'BEST ' + fmt(best), cx, cssH * 0.36 + T * 1.3);
    ctx.font = `600 ${sub}px ${ROUND}`; ctx.fillStyle = '#7fa9d6';
    ctx.fillText('REACHED WAVE ' + wave, cx, cssH * 0.36 + T * 1.3 + sub * 1.8);
    if (overT > 0.8) {
      const again = IC.standalone ? (touch ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN') : 'PRESS START TO PLAY AGAIN';
      ctx.globalAlpha = a * blink; glowText(again, cx, cssH * 0.72, Math.round(sub * 1.1), '#bfe4ff', '#3a9dff', 800);
    }
    ctx.globalAlpha = 1;
  }
  if (paused) {
    dim(0.55); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    glowText('PAUSED', cx, cssH * 0.44, Math.round(T * 0.6), '#f2f9ff', '#3a9dff', 900);
    ctx.font = `600 ${Math.round(clamp(T * 0.18, 13, 19))}px ${ROUND}`; ctx.fillStyle = '#9fd6ff';
    ctx.fillText(touchMode || coarse ? 'Tap to continue' : 'Press any key or click to continue', cx, cssH * 0.44 + T * 0.6);
  }
  if (muted) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.font = `600 11px ${MONO}`; ctx.fillStyle = '#5a86b8'; ctx.fillText('MUTED (M)', cssW - 10, cssH - 8); }
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const sk = reduced ? shake * 0.25 : shake;
  drawWorld(rnd(-sk, sk) * scale, rnd(-sk, sk) * scale);
  drawBloom();
  drawBack();
  if (flash > 0 && !reduced) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,150,70,${flash * 0.22})`; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (state !== 'attract') drawHud();
  if (state === 'play' && (touchMode || coarse) && !paused) drawTouch();
  drawOverlay();
}

// ---------- audio levels follow the game, once per frame ----------
let lastThr = -1, lastHum = -1;
function updateAudio() {
  if (!ac) return;
  const live = state === 'play' && !paused;
  const th = live && ship && ship.alive ? ship.thr * 0.2 : 0;
  if (Math.abs(th - lastThr) > 0.01) { thrustG.gain.setTargetAtTime(th, ac.currentTime, 0.04); lastThr = th; }
  const hu = live && saucer ? 0.03 : 0;
  if (hu !== lastHum) { humG.gain.setTargetAtTime(hu, ac.currentTime, 0.05); if (saucer) humOsc.frequency.setValueAtTime(saucer.small ? 900 : 520, ac.currentTime); lastHum = hu; }
}

// ---------- main loop: fixed 120 Hz steps, any refresh rate ----------
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { acc -= STEP; time += STEP; step(STEP); }
    shake *= Math.exp(-9 * dt);
  }
  updateAudio();
  render();
}
attract();
requestAnimationFrame(frame);
IC.ready();
})();
</script>
