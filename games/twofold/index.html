<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Twofold</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0714; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Twofold, a sliding merge puzzle"></canvas>
<script>
'use strict';
/* Twofold: slide numbered tiles on a 4x4 board; equal tiles merge and double.
   Original game for the Insert Coin arcade. Everything is drawn and synthesised here. */

const IC = window.InsertCoin || { standalone: true, muted: false, ready() {}, gameOver() {}, submitScore() {}, on() {} };
const FONT = 'ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = matchMedia('(pointer: coarse)').matches;
const N = 4, SLIDE = 105, POP = 180, SPAWN = 170, STEP = 1000 / 120;

const cv = document.getElementById('c');
const g = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, L = {};

/* ---------- audio ---------- */
let ac = null, master = null, noiseBuf = null, muted = !!IC.muted;
function audio() {
  try {
    if (!ac) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      ac = new A();
      master = ac.createGain();
      master.gain.value = 0.55;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
  } catch (e) { /* no audio, no problem */ }
}
function tone(f, dur, o = {}) {
  if (muted || !ac) return;
  const t0 = ac.currentTime + (o.delay || 0);
  const osc = ac.createOscillator(), gn = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + 0.008);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gn).connect(master);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function noise(dur, freq, vol, to) {
  if (muted || !ac) return;
  const t0 = ac.currentTime;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), gn = ac.createGain();
  src.buffer = noiseBuf;
  f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(freq, t0);
  if (to) f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  gn.gain.setValueAtTime(vol, t0);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(gn).connect(master);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}
const sfx = {
  slide() { noise(0.09, 1800, 0.05, 700); },
  bump() { tone(110, 0.08, { type: 'triangle', vol: 0.08, to: 80 }); },
  merge(v) {
    const k = Math.log2(v), f = 240 * Math.pow(2, (k - 1) / 6);
    tone(f, 0.16, { type: 'triangle', vol: 0.13 });
    tone(f * 1.5, 0.12, { type: 'sine', vol: 0.06, delay: 0.03 });
  },
  milestone() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, { type: 'triangle', vol: 0.12, delay: i * 0.07 })); },
  start() { [330, 440, 660].forEach((f, i) => tone(f, 0.14, { type: 'sine', vol: 0.12, delay: i * 0.06 })); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.12, delay: i * 0.12 })); },
  click() { tone(660, 0.05, { type: 'sine', vol: 0.06 }); },
};

/* ---------- board model ---------- */
let clock = 0, uid = 0;
const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]]; // up, right, down, left
const inb = (r, c) => r >= 0 && r < N && c >= 0 && c < N;

class Board {
  constructor(demo) {
    this.demo = demo;
    this.grid = Array.from({ length: N }, () => Array(N).fill(null));
    this.tiles = [];
    this.score = 0;
    this.moves = 0;
    this.maxV = 0;
    this.pending = null;
    this.animStart = 0;
    this.deadAt = 0;
    this.spawn(); this.spawn();
  }
  empties() {
    const e = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (!this.grid[r][c]) e.push([r, c]);
    return e;
  }
  spawn() {
    const e = this.empties();
    if (!e.length) return;
    const [r, c] = e[(Math.random() * e.length) | 0];
    const t = { id: ++uid, v: Math.random() < 0.9 ? 2 : 4, r, c, fr: r, fc: c, born: clock, pop: -1e9, dying: false };
    this.grid[r][c] = t;
    this.tiles.push(t);
    this.maxV = Math.max(this.maxV, t.v);
  }
  canMoveDir(d) {
    const [dr, dc] = DIRS[d];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = this.grid[r][c];
      if (!t || !inb(r + dr, c + dc)) continue;
      const n = this.grid[r + dr][c + dc];
      if (!n || n.v === t.v) return true;
    }
    return false;
  }
  canMove() { return [0, 1, 2, 3].some((d) => this.canMoveDir(d)); }
  /* Returns true if anything moved. Positions update at once; the slide is drawn from fr/fc. */
  move(d) {
    this.finish();
    const [dr, dc] = DIRS[d];
    const rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();
    for (const t of this.tiles) { t.fr = t.r; t.fc = t.c; t.merged = false; }
    let moved = false;
    const merges = [];
    for (const r of rows) for (const c of cols) {
      const t = this.grid[r][c];
      if (!t) continue;
      let nr = r, nc = c;
      while (inb(nr + dr, nc + dc) && !this.grid[nr + dr][nc + dc]) { nr += dr; nc += dc; }
      const nx = inb(nr + dr, nc + dc) ? this.grid[nr + dr][nc + dc] : null;
      this.grid[r][c] = null;
      if (nx && nx.v === t.v && !nx.merged) {
        nx.merged = true;
        t.dying = true;
        t.r = nr + dr; t.c = nc + dc;
        merges.push(nx);
        this.score += t.v * 2;
        moved = true;
      } else {
        this.grid[nr][nc] = t;
        t.r = nr; t.c = nc;
        if (nr !== r || nc !== c) moved = true;
      }
    }
    if (!moved) return false;
    this.moves++;
    this.animStart = clock;
    this.pending = merges;
    return true;
  }
  /* End of a slide: absorb merged tiles, double the survivors, spawn a new tile. */
  finish() {
    if (!this.pending) return;
    const merges = this.pending;
    this.pending = null;
    this.tiles = this.tiles.filter((t) => !t.dying);
    for (const t of this.tiles) { t.fr = t.r; t.fc = t.c; }
    const before = this.maxV;
    for (const m of merges) { m.v *= 2; m.pop = clock; this.maxV = Math.max(this.maxV, m.v); onMerge(this, m); }
    if (merges.length && !this.demo) onScored(merges);
    this.spawn();
    if (!this.demo && this.maxV >= 256 && this.maxV > before) onMilestone(this.maxV);
    if (!this.canMove()) this.deadAt = clock;
  }
  update() { if (this.pending && clock - this.animStart >= SLIDE) this.finish(); }
}

/* ---------- game state ---------- */
let state = 'attract', paused = false, best = 0, board = null, demo = new Board(true);
let demoNext = 0, overAt = 0, overReason = '', newBest = false, endConfirm = -1e9, shownScore = 0, runId = 0, overSent = -1;
let shake = 0, nudge = { x: 0, y: 0, t: -1e9 }, flash = 0;
const parts = [], pops = [], banners = [];
const bokeh = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), r: 20 + Math.random() * 90, h: Math.random() < 0.5 ? 30 + Math.random() * 30 : 190 + Math.random() * 60, s: 0.004 + Math.random() * 0.01, p: Math.random() * 6.28 }));

function newRun() {
  audio();
  board = new Board(false);
  state = 'play';
  paused = false;
  runId++;
  newBest = false;
  shownScore = 0;
  endConfirm = -1e9;
  parts.length = pops.length = banners.length = 0;
  sfx.start();
}
function endRun(reason) {
  if (state !== 'play' || overSent === runId) return;
  overSent = runId;
  board.finish();
  state = 'over';
  overAt = clock;
  overReason = reason;
  newBest = board.score > best && board.score > 0;
  best = Math.max(best, board.score);
  sfx.over();
  IC.gameOver(board.score | 0);
}
function tryMove(d) {
  if (state !== 'play' || paused) return;
  if (board.move(d)) sfx.slide();
  else {
    sfx.bump();
    nudge = { x: DIRS[d][1], y: DIRS[d][0], t: clock };
  }
}
function requestEnd() {
  if (state !== 'play') return;
  if (clock - endConfirm < 2500) endRun('banked');
  else { endConfirm = clock; sfx.click(); }
}

function onMerge(b, t) {
  if (b !== (state === 'attract' ? demo : board)) return;
  const k = Math.log2(t.v), h = hue(t.v);
  const { x, y } = cellCenter(t.r, t.c);
  const n = RM ? 4 : 8 + Math.min(10, k);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.06 + Math.random() * 0.22) * L.cell / 60;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: 380 + Math.random() * 300, h, r: 1.5 + Math.random() * 2.5 });
  }
  if (b.demo) return;
  sfx.merge(t.v);
  if (t.v >= 128 && !RM) shake = Math.min(10, shake + k * 0.5);
}
/* One popup per move: the move's total, over its biggest merge. Older popups hurry off. */
function onScored(merges) {
  if (state !== 'play') return;
  let top = merges[0], sum = 0;
  for (const m of merges) { sum += m.v; if (m.v > top.v) top = m; }
  for (const p of pops) p.born = Math.min(p.born, clock - 520);
  const { x, y } = cellCenter(top.r, top.c);
  pops.push({ x, y: y - L.cell * 0.15, text: '+' + sum, born: clock, h: hue(top.v) });
}
function onMilestone(v) {
  banners.push({ text: v >= 2048 ? v + '!' : v + '', sub: v >= 2048 ? 'Legendary' : v >= 1024 ? 'Nearly there' : 'Nice tile', born: clock, h: hue(v) });
  if (!RM) { shake = Math.min(14, shake + 8); flash = 1; }
  sfx.milestone();
}

/* ---------- layout ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const ui = Math.max(0.75, Math.min(1.3, Math.min(W, H) / 520));
  const hud = 62 * ui, gap = 14 * ui, foot = 26 * ui;
  const B = Math.max(200, Math.min(W - 32, H - 32 - hud - gap - foot, 640));
  const top = Math.max(12, (H - (hud + gap + B + foot)) / 2);
  const bx = (W - B) / 2, by = top + hud + gap;
  const pad = B * 0.03, cell = (B - pad * 5) / 4;
  L = { ui, hud, B, bx, by, top, pad, cell, foot };
  const bw = Math.min(B * 0.27, 150 * ui);
  L.scoreBox = { x: bx, y: top, w: bw, h: hud };
  L.bestBox = { x: bx + bw + 8 * ui, y: top, w: bw, h: hud };
  const ew = Math.min(B * 0.3, 160 * ui);
  L.endBtn = { x: bx + B - ew, y: top + hud * 0.18, w: ew, h: hud * 0.64 };
  L.muteBtn = { x: W - 44 * ui, y: 8 * ui, w: 36 * ui, h: 36 * ui };
}
function cellCenter(r, c) {
  return { x: L.bx + L.pad + c * (L.cell + L.pad) + L.cell / 2, y: L.by + L.pad + r * (L.cell + L.pad) + L.cell / 2 };
}
const hue = (v) => (35 - (Math.log2(v) - 1) * 22 + 720) % 360; // warm amber -> red -> violet -> blue -> cyan -> green

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function text(s, x, y, size, color, weight = 800, align = 'center', maxW = 0) {
  g.font = `${weight} ${size}px ${FONT}`;
  if (maxW) {
    const w = g.measureText(s).width;
    if (w > maxW) { size *= maxW / w; g.font = `${weight} ${size}px ${FONT}`; }
  }
  g.fillStyle = color;
  g.textAlign = align;
  g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

function drawBackground() {
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#120a24');
  bg.addColorStop(1, '#06040d');
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    const x = (b.x + Math.sin(clock * 0.0001 + b.p) * 0.03) * W;
    const y = ((b.y - clock * b.s * 0.001) % 1 + 1) % 1 * (H + 200) - 100;
    const gr = g.createRadialGradient(x, y, 0, x, y, b.r);
    gr.addColorStop(0, `hsla(${b.h},90%,60%,0.07)`);
    gr.addColorStop(1, `hsla(${b.h},90%,60%,0)`);
    g.fillStyle = gr;
    g.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
  }
  g.globalCompositeOperation = 'source-over';
}

function drawTile(t, b) {
  let p = 1;
  if (b.pending) p = easeOut(Math.min(1, (clock - b.animStart) / SLIDE));
  const r = t.fr + (t.r - t.fr) * p, c = t.fc + (t.c - t.fc) * p;
  const { x, y } = cellCenter(r, c);
  let s = 1;
  const age = clock - t.born;
  if (age < SPAWN) s = Math.max(0, easeBack(age / SPAWN));
  const pa = clock - t.pop;
  if (pa < POP) s *= 1 + (RM ? 0.06 : 0.2) * Math.sin(Math.PI * pa / POP);
  const k = Math.log2(t.v), h = hue(t.v), sz = L.cell * s, half = sz / 2, rad = sz * 0.17;
  g.save();
  g.shadowColor = `hsla(${h},100%,60%,${Math.min(0.95, 0.45 + k * 0.05)})`;
  g.shadowBlur = L.cell * (0.22 + Math.min(0.6, k * 0.05)) * DPR;
  const gr = g.createLinearGradient(x, y - half, x, y + half);
  gr.addColorStop(0, `hsl(${h},95%,72%)`);
  gr.addColorStop(1, `hsl(${h},88%,54%)`);
  g.fillStyle = gr;
  rr(x - half, y - half, sz, sz, rad);
  g.fill();
  g.restore();
  // glassy top sheen
  g.save();
  rr(x - half, y - half, sz, sz, rad);
  g.clip();
  const sh = g.createLinearGradient(x, y - half, x, y);
  sh.addColorStop(0, 'rgba(255,255,255,0.38)');
  sh.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sh;
  g.fillRect(x - half, y - half, sz, half * 0.9);
  if (t.v >= 2048) { // shimmer sweep on legendary tiles
    const sx = x - sz + ((clock * 0.0007) % 2) * sz * 1.5;
    const sw = g.createLinearGradient(sx, 0, sx + sz * 0.4, 0);
    sw.addColorStop(0, 'rgba(255,255,255,0)');
    sw.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    sw.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = sw;
    g.fillRect(x - half, y - half, sz, sz);
  }
  g.restore();
  g.strokeStyle = `hsla(${h},100%,88%,0.55)`;
  g.lineWidth = Math.max(1, sz * 0.02);
  rr(x - half + 1, y - half + 1, sz - 2, sz - 2, rad);
  g.stroke();
  const digits = String(t.v).length;
  const fs = sz * [0, 0.5, 0.46, 0.37, 0.3, 0.25, 0.21, 0.18][Math.min(7, digits)];
  text(String(t.v), x, y + sz * 0.02, fs, 'rgba(24,10,34,0.92)', 850);
}

function drawBoard(b) {
  let ox = 0, oy = 0;
  if (shake > 0.1) { ox = (Math.random() - 0.5) * shake; oy = (Math.random() - 0.5) * shake; }
  const na = clock - nudge.t;
  if (na < 160) { const k = Math.sin(Math.PI * na / 160) * L.cell * 0.05; ox += nudge.x * k; oy += nudge.y * k; }
  g.save();
  g.translate(ox, oy);
  // board plate
  g.save();
  g.shadowColor = 'rgba(140,90,255,0.35)';
  g.shadowBlur = 30 * DPR;
  g.fillStyle = 'rgba(28,18,52,0.85)';
  rr(L.bx, L.by, L.B, L.B, L.B * 0.045);
  g.fill();
  g.restore();
  g.strokeStyle = 'rgba(190,150,255,0.18)';
  g.lineWidth = 1.5;
  rr(L.bx + 0.5, L.by + 0.5, L.B - 1, L.B - 1, L.B * 0.045);
  g.stroke();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const { x, y } = cellCenter(r, c);
    g.fillStyle = 'rgba(255,255,255,0.045)';
    rr(x - L.cell / 2, y - L.cell / 2, L.cell, L.cell, L.cell * 0.17);
    g.fill();
  }
  for (const t of b.tiles) if (t.dying) drawTile(t, b);
  for (const t of b.tiles) if (!t.dying) drawTile(t, b);
  g.restore();
}

function drawHud() {
  const ui = L.ui;
  shownScore += (board.score - shownScore) * 0.2;
  if (Math.abs(board.score - shownScore) < 1) shownScore = board.score;
  for (const [box, label, val, col] of [[L.scoreBox, 'SCORE', Math.round(shownScore), '#ffd28a'], [L.bestBox, 'BEST', Math.max(best, board.score), '#9fd8ff']]) {
    g.fillStyle = 'rgba(255,255,255,0.06)';
    rr(box.x, box.y, box.w, box.h, 12 * ui);
    g.fill();
    text(label, box.x + box.w / 2, box.y + box.h * 0.3, 11 * ui, 'rgba(255,255,255,0.55)', 700);
    text(String(val), box.x + box.w / 2, box.y + box.h * 0.66, 22 * ui, col, 850, 'center', box.w - 12);
  }
  if (state === 'play') {
    const e = L.endBtn, armed = clock - endConfirm < 2500;
    g.fillStyle = armed ? 'rgba(255,110,140,0.25)' : 'rgba(255,255,255,0.07)';
    rr(e.x, e.y, e.w, e.h, e.h / 2);
    g.fill();
    g.strokeStyle = armed ? 'rgba(255,130,160,0.8)' : 'rgba(255,255,255,0.18)';
    g.lineWidth = 1.5;
    rr(e.x + 0.75, e.y + 0.75, e.w - 1.5, e.h - 1.5, e.h / 2);
    g.stroke();
    text(armed ? 'Tap to confirm' : 'End run', e.x + e.w / 2, e.y + e.h / 2, 14 * ui, armed ? '#ffc2d0' : 'rgba(255,255,255,0.8)', 750, 'center', e.w - 16);
  }
}

function drawMute() {
  const m = L.muteBtn, x = m.x + m.w / 2, y = m.y + m.h / 2, s = m.w * 0.22;
  g.strokeStyle = g.fillStyle = 'rgba(255,255,255,0.5)';
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(x - s * 1.4, y - s * 0.5); g.lineTo(x - s * 0.6, y - s * 0.5); g.lineTo(x + s * 0.3, y - s * 1.2);
  g.lineTo(x + s * 0.3, y + s * 1.2); g.lineTo(x - s * 0.6, y + s * 0.5); g.lineTo(x - s * 1.4, y + s * 0.5);
  g.closePath(); g.fill();
  g.beginPath();
  if (muted) { g.moveTo(x + s * 0.8, y - s * 0.6); g.lineTo(x + s * 1.9, y + s * 0.6); g.moveTo(x + s * 1.9, y - s * 0.6); g.lineTo(x + s * 0.8, y + s * 0.6); }
  else { g.arc(x + s * 0.4, y, s * 1.1, -0.8, 0.8); }
  g.stroke();
}

function drawFx() {
  g.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const a = 1 - p.life / p.max;
    g.fillStyle = `hsla(${p.h},100%,70%,${a})`;
    g.beginPath();
    g.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, 6.283);
    g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  for (const p of pops) {
    const t = (clock - p.born) / 750;
    const y = p.y - easeOut(t) * L.cell * 0.6;
    g.globalAlpha = Math.max(0, 1 - t * t);
    g.save();
    g.shadowColor = `hsl(${p.h},100%,55%)`;
    g.shadowBlur = 12 * DPR;
    g.lineWidth = Math.max(2, L.cell * 0.035);
    g.strokeStyle = 'rgba(20,8,30,0.85)';
    g.font = `900 ${L.cell * 0.3}px ${FONT}`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.strokeText(p.text, p.x, y);
    g.shadowBlur = 0;
    text(p.text, p.x, y, L.cell * 0.3, '#fff', 900);
    g.restore();
    g.globalAlpha = 1;
  }
  for (const b of banners) {
    const t = (clock - b.born) / 1400;
    const s = t < 0.2 ? easeBack(t / 0.2) : 1;
    g.globalAlpha = t > 0.7 ? Math.max(0, 1 - (t - 0.7) / 0.3) : 1;
    const cx = L.bx + L.B / 2, cy = L.by + L.B / 2;
    g.save();
    g.translate(cx, cy);
    g.scale(s, s);
    g.fillStyle = 'rgba(10,6,22,0.72)';
    rr(-L.B * 0.36, -L.B * 0.17, L.B * 0.72, L.B * 0.36, L.B * 0.06);
    g.fill();
    g.shadowColor = `hsl(${b.h},100%,60%)`;
    g.shadowBlur = 30 * DPR;
    text(b.text, 0, -L.B * 0.03, L.B * 0.2, '#fff', 900);
    g.shadowBlur = 0;
    text(b.sub, 0, L.B * 0.11, L.B * 0.05, `hsl(${b.h},100%,82%)`, 750);
    g.restore();
    g.globalAlpha = 1;
  }
  if (flash > 0.01) { g.fillStyle = `rgba(255,240,220,${flash * 0.18})`; g.fillRect(0, 0, W, H); }
}

function veil(a) {
  g.fillStyle = `rgba(8,5,18,${a})`;
  rr(L.bx, L.by, L.B, L.B, L.B * 0.045);
  g.fill();
}
function drawTitle(cx, cy, size) {
  g.save();
  const gr = g.createLinearGradient(cx - size * 2.4, 0, cx + size * 2.4, 0);
  gr.addColorStop(0, '#ffb347');
  gr.addColorStop(0.35, '#ff5f8f');
  gr.addColorStop(0.7, '#a07bff');
  gr.addColorStop(1, '#4fe3ff');
  g.shadowColor = 'rgba(255,120,170,0.6)';
  g.shadowBlur = size * 0.5 * DPR;
  text('TWOFOLD', cx, cy, size, gr, 900, 'center', L.B * 0.9);
  g.restore();
}
function drawAttract() {
  veil(0.55);
  const cx = L.bx + L.B / 2, cy = L.by + L.B / 2, u = L.B / 400;
  drawTitle(cx, cy - 70 * u, 64 * u);
  text('Slide. Merge. Double.', cx, cy - 18 * u, 18 * u, 'rgba(255,255,255,0.8)', 650);
  const hint = COARSE ? 'Swipe to slide every tile' : 'Arrows or WASD slide every tile';
  text(hint, cx, cy + 22 * u, 15 * u, 'rgba(255,255,255,0.65)', 600, 'center', L.B * 0.9);
  text('Equal numbers merge — keep a move open', cx, cy + 46 * u, 15 * u, 'rgba(255,255,255,0.65)', 600, 'center', L.B * 0.9);
  const pulse = 0.55 + 0.45 * Math.sin(clock * 0.005);
  const go = IC.standalone ? (COARSE ? 'Tap to start' : 'Press Enter or click to start') : 'Press start';
  g.globalAlpha = pulse;
  text(go, cx, cy + 100 * u, 22 * u, '#ffd28a', 850);
  g.globalAlpha = 1;
}
function drawOver() {
  const t = Math.min(1, (clock - overAt) / 400);
  veil(0.82 * t);
  g.globalAlpha = t;
  const cx = L.bx + L.B / 2, cy = L.by + L.B / 2, u = L.B / 400;
  text(overReason === 'banked' ? 'Run banked' : 'No more moves', cx, cy - 72 * u, 34 * u, '#fff', 900);
  text(String(board.score), cx, cy - 10 * u, 60 * u, '#ffd28a', 900, 'center', L.B * 0.85);
  text(newBest ? 'New best!' : 'Best ' + best, cx, cy + 40 * u, 18 * u, newBest ? '#7ff7c9' : 'rgba(255,255,255,0.7)', 750);
  text('Largest tile ' + board.maxV, cx, cy + 66 * u, 15 * u, 'rgba(255,255,255,0.55)', 650);
  if (clock - overAt > 700) {
    g.globalAlpha = t * (0.55 + 0.45 * Math.sin(clock * 0.005));
    text(IC.standalone ? (COARSE ? 'Tap to play again' : 'Press Enter to play again') : 'Press start to play again', cx, cy + 112 * u, 19 * u, '#9fd8ff', 800);
  }
  g.globalAlpha = 1;
}
function drawFoot() {
  const msg = state === 'play' ? (COARSE ? 'Swipe to slide · End run banks your score' : 'Arrows / WASD · E twice ends the run · M mutes') : (COARSE ? '' : 'M mutes');
  if (msg) text(msg, W / 2, L.by + L.B + L.foot * 0.75, 12 * L.ui, 'rgba(255,255,255,0.38)', 600, 'center', W - 24);
}
function drawPaused() {
  g.fillStyle = 'rgba(6,4,14,0.72)';
  g.fillRect(0, 0, W, H);
  text('Paused', W / 2, H / 2 - 18 * L.ui, 40 * L.ui, '#fff', 900);
  text(COARSE ? 'Tap to continue' : 'Click or press a key to continue', W / 2, H / 2 + 24 * L.ui, 17 * L.ui, 'rgba(255,255,255,0.75)', 650);
}

function draw() {
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  const b = state === 'attract' ? demo : board;
  drawBoard(b);
  if (state === 'attract') {
    // compact HUD showing the best so far
    const box = L.bestBox;
    g.fillStyle = 'rgba(255,255,255,0.06)';
    rr(L.scoreBox.x, box.y, box.w, box.h, 12 * L.ui); g.fill();
    text('BEST', L.scoreBox.x + box.w / 2, box.y + box.h * 0.3, 11 * L.ui, 'rgba(255,255,255,0.55)', 700);
    text(String(best), L.scoreBox.x + box.w / 2, box.y + box.h * 0.66, 22 * L.ui, '#9fd8ff', 850);
  } else drawHud();
  drawFx();
  if (state === 'attract') drawAttract();
  if (state === 'over') drawOver();
  drawFoot();
  drawMute();
  if (paused) drawPaused();
}

/* ---------- simulation ---------- */
function step(dt) {
  clock += dt;
  if (state === 'attract') {
    demo.update();
    if (clock > demoNext) {
      if (!demo.canMove()) { demo = new Board(true); demoNext = clock + 900; }
      else {
        const order = Math.random() < 0.2 ? [0, 1, 2, 3].sort(() => Math.random() - 0.5) : [2, 3, 1, 0];
        for (const d of order) if (demo.canMoveDir(d)) { demo.move(d); break; }
        demoNext = clock + 420;
      }
    }
  } else if (board) {
    board.update();
    if (state === 'play' && board.deadAt && clock - board.deadAt > 550) endRun('stuck');
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985;
    if (p.life > p.max) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) if (clock - pops[i].born > 750) pops.splice(i, 1);
  for (let i = banners.length - 1; i >= 0; i--) if (clock - banners[i].born > 1400) banners.splice(i, 1);
  shake *= Math.pow(0.9, dt / 8.33);
  flash *= Math.pow(0.9, dt / 8.33);
}
let last = performance.now(), acc = 0;
function frame(t) {
  acc += Math.min(100, t - last);
  last = t;
  if (paused) acc = 0;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
const hit = (b, x, y) => b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function toggleMute() { muted = !muted; if (!muted) { audio(); sfx.click(); } }
function startFromInput() {
  if (!IC.standalone) return;
  if (state === 'attract' || (state === 'over' && clock - overAt > 700)) newRun();
}
let swipe = null;
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  audio();
  cv.focus();
  if (paused) { paused = false; return; }
  const x = e.clientX, y = e.clientY;
  if (hit(L.muteBtn, x, y)) { toggleMute(); return; }
  if (state === 'play' && hit(L.endBtn, x, y)) { requestEnd(); return; }
  if (state !== 'play') { startFromInput(); return; }
  swipe = { x, y, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
});
cv.addEventListener('pointermove', (e) => {
  if (!swipe || e.pointerId !== swipe.id) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < Math.max(18, L.cell * 0.22)) return;
  tryMove(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
  swipe = null;
});
const endSwipe = () => { swipe = null; };
cv.addEventListener('pointerup', endSwipe);
cv.addEventListener('pointercancel', endSwipe);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

const KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
window.addEventListener('keydown', (e) => {
  audio();
  if (e.code in KEYS || e.code === 'Space') e.preventDefault();
  if (paused) { paused = false; return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (state !== 'play') {
    if (e.code === 'Enter' || e.code === 'Space') startFromInput();
    return;
  }
  if (e.code === 'KeyE') { requestEnd(); return; }
  if (e.code in KEYS && !e.repeat) tryMove(KEYS[e.code]);
});

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') paused = true; });
window.addEventListener('resize', resize);

IC.on('init', (d) => { muted = !!(d && d.muted); });
IC.on('mute', (d) => { muted = !!(d && d.muted); });
IC.on('start', () => { audio(); newRun(); });

resize();
requestAnimationFrame((t) => { last = t; frame(t); });
IC.ready();
</script>
</body>
</html>
